# KnightVision at knightvision.realcompanys.com: a static site, no backend.
# Install: copy to /etc/nginx/sites-available/, symlink into sites-enabled, `nginx -t && systemctl reload nginx`,
# then `certbot --nginx -d knightvision.realcompanys.com` adds HTTPS and the redirect from http.
server {
    listen 80;
    listen [::]:80;
    server_name knightvision.realcompanys.com;

    root /var/www/knightvision;
    index index.html;

    # Pages are plain files: /, /flight.html, /prototypes/...
    location / {
        try_files $uri $uri/ =404;
    }

    # Vite fingerprints everything in /assets, so it can be cached for good.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ONNX Runtime's loader is an ES module (.mjs); browsers refuse modules served as plain downloads.
    location ~ \.mjs$ {
        types { }
        default_type text/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The 25 MB network. Cache it a week so a returning visitor doesn't download it again.
    location = /knightvision.onnx {
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=604800";
    }

    # ONNX Runtime's WebAssembly must be served as application/wasm to compile in the browser
    # (older mime.types files lack it). It lives in /assets, so it keeps the long cache too.
    location ~ \.wasm$ {
        default_type application/wasm;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;
}
